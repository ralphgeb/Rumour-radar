name: Update news

on:
  schedule:
    - cron: "0 */3 * * *"   # every 30 minutes
  workflow_dispatch:          # adds a "Run workflow" button

permissions:
  contents: write

concurrency:
  group: update-news
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Collect and analyse news
        run: node scripts/update-news.mjs
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Save results
        run: |
          git config user.name "rumour-radar-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet || (git commit -m "Update news" && git pull --rebase && git push)
