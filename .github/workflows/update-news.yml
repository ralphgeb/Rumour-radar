name: Update news

on:
  schedule:
    # Checks every 30 minutes whether anything is due (London time):
    #   - the news and Today briefing from 7:30 and from 17:00
    #   - stock prices about once an hour on weekdays
    # GitHub often starts scheduled runs late or skips some, so the updater
    # catches up on anything missed instead of relying on exact times.
    # Checks with nothing to do take a few seconds.
    - cron: "12,42 * * * *"
  workflow_dispatch:          # the "Run workflow" button and the app's refresh button
    inputs:
      briefing:
        description: "Write a new Today briefing? (auto = only if the last one is over 8 hours old)"
        type: choice
        options: [auto, "yes", "no"]
        default: auto
      mode:
        description: "full = news and stocks, stocks = stocks only (quick), prices = prices only (quickest)"
        type: choice
        options: [full, stocks, prices]
        default: full
      watchlist:
        description: "Your stocks, sent by the app (leave empty)"
        type: string
        default: ""

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.gate.outputs.go }}
      mode: ${{ steps.gate.outputs.mode }}
    steps:
      - uses: actions/checkout@v5
        if: github.event_name == 'schedule'
        with:
          sparse-checkout: |
            scripts/due.mjs
            data/news.json
            data/stocks.json
          sparse-checkout-cone-mode: false
      - name: What's due?
        id: gate
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "go=true" >> "$GITHUB_OUTPUT"; echo "mode=${{ github.event.inputs.mode || 'full' }}" >> "$GITHUB_OUTPUT"
          else
            node scripts/due.mjs
          fi

  update:
    needs: check
    if: needs.check.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    # Only one update at a time; a waiting one is never cancelled by a check.
    concurrency:
      group: update-news
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the stock price tool
        run: pip install --quiet --upgrade yfinance financedatabase

      - name: Collect and analyse news
        run: node scripts/update-news.mjs
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          MAKE_BRIEFING: ${{ github.event.inputs.briefing || 'auto' }}
          MODE: ${{ needs.check.outputs.mode }}
          WATCHLIST: ${{ github.event.inputs.watchlist || '' }}

      - name: Save results
        run: |
          git config user.name "rumour-radar-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet || (git commit -m "Update ${{ needs.check.outputs.mode }}" && git pull --rebase && git push)
